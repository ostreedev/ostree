name: ci-bootc

permissions:
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stream: [stream9, stream10]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bootc-dev/actions/bootc-ubuntu-setup@main

      - name: unitcontainer
        run: STREAM=${{ matrix.stream }} just unitcontainer
      - name: unittest
        run: STREAM=${{ matrix.stream }} just unittest
      - name: Upload unittest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-log-PR-${{ github.event.number }}-${{ matrix.stream }}
          path: target/unittest

  integration:
    name: integration (${{ matrix.stream }}, ${{ matrix.plans.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stream: [stream9, stream10]
        # Each TMT plan boots its own VM (several minutes of provisioning
        # each), and the bootconfig-extra plan reboots six times, so run
        # that one on its own runner instead of serializing everything.
        plans:
          - name: core
            args: --exclude bootconfig-extra
            timeout: 45
          - name: bootconfig-extra
            args: --filter bootconfig-extra
            timeout: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bootc-dev/actions/bootc-ubuntu-setup@main
        with:
          libvirt: true
      - name: Install tmt
        run: pip install --user "tmt[provision-virtual]"

      - name: build
        run: STREAM=${{ matrix.stream }} just build
      - name: TMT tests (bcvk)
        timeout-minutes: ${{ matrix.plans.timeout }}
        run: STREAM=${{ matrix.stream }} just test-tmt ${{ matrix.plans.args }}
      - name: Archive TMT logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmt-log-PR-${{ github.event.number }}-${{ matrix.stream }}-${{ matrix.plans.name }}
          path: /var/tmp/tmt
